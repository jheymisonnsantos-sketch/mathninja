        // 1. SOUND EFFECTS SYSTEM (WEB AUDIO API)

        class SoundFX {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                try {
                    if (!this.ctx) {
                        const AudioCtx = window.AudioContext || window.webkitAudioContext;
                        if (AudioCtx) this.ctx = new AudioCtx();
                    }
                    if (this.ctx && this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                } catch (e) {
                    console.warn("AudioContext indisponível:", e);
                }
            }

            playSlash() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.15);
            }

            playCorrect() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.06);

                    gain.gain.setValueAtTime(0.2, now + idx * 0.06);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.2);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now + idx * 0.06);
                    osc.stop(now + idx * 0.06 + 0.2);
                });
            }

            playWrong() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(80, now + 0.3);

                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        const soundFX = new SoundFX();

        // 2. MATH GENERATOR LOGIC

        function generateMathQuestion(level) {
            let num1, num2, op, answer, text;
            let valid = false;

            while (!valid) {
                if (level === 1) {
                    op = '+';
                    num1 = Math.floor(Math.random() * 20) + 1;
                    num2 = Math.floor(Math.random() * 20) + 1;
                    answer = num1 + num2;
                } else if (level === 2) {
                    op = Math.random() > 0.5 ? '+' : '-';
                    if (op === '+') {
                        num1 = Math.floor(Math.random() * 45) + 5;
                        num2 = Math.floor(Math.random() * 45) + 1;
                        answer = num1 + num2;
                    } else {
                        num1 = Math.floor(Math.random() * 60) + 10;
                        num2 = Math.floor(Math.random() * num1);
                        answer = num1 - num2;
                    }
                } else if (level === 3) {
                    const r = Math.random();
                    if (r < 0.5) {
                        op = '×';
                        num1 = Math.floor(Math.random() * 9) + 2;
                        num2 = Math.floor(Math.random() * 10) + 1;
                        answer = num1 * num2;
                    } else {
                        op = Math.random() > 0.5 ? '+' : '-';
                        num1 = Math.floor(Math.random() * 60) + 10;
                        num2 = op === '+' ? Math.floor(Math.random() * 30) : Math.floor(Math.random() * num1);
                        answer = op === '+' ? num1 + num2 : num1 - num2;
                    }
                } else {
                    const r = Math.random();
                    if (r < 0.4) {
                        op = '×';
                        num1 = Math.floor(Math.random() * 11) + 2;
                        num2 = Math.floor(Math.random() * 8) + 2;
                        answer = num1 * num2;
                    } else if (r < 0.7) {
                        op = '÷';
                        num2 = Math.floor(Math.random() * 9) + 2;
                        answer = Math.floor(Math.random() * 15) + 1;
                        num1 = num2 * answer;
                    } else {
                        op = Math.random() > 0.5 ? '+' : '-';
                        num1 = Math.floor(Math.random() * 70) + 10;
                        num2 = op === '+' ? Math.floor(Math.random() * 25) : Math.floor(Math.random() * num1);
                        answer = op === '+' ? num1 + num2 : num1 - num2;
                    }
                }

                if (answer >= 0 && answer <= 99) {
                    valid = true;
                }
            }

            text = `${num1} ${op} ${num2} = ?`;

            let distractors = new Set();
            while (distractors.size < 3) {
                let offset = (Math.floor(Math.random() * 6) + 1) * (Math.random() > 0.5 ? 1 : -1);
                let wrong = answer + offset;
                if (wrong >= 0 && wrong <= 99 && wrong !== answer) {
                    distractors.add(wrong);
                }
            }

            return {
                questionText: text,
                correctAnswer: answer,
                allOptions: shuffleArray([answer, ...Array.from(distractors)])
            };
        }

        function shuffleArray(arr) {
            return arr.sort(() => Math.random() - 0.5);
        }

        function createVRStartButton3D(labelText) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 160;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, 512, 160);
            ctx.lineWidth = 10;
            ctx.strokeStyle = '#00f3ff';
            ctx.strokeRect(8, 8, 496, 144);

            ctx.fillStyle = '#00f3ff';
            ctx.font = 'bold 36px Segoe UI, Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(labelText, 256, 82);

            const tex = new THREE.CanvasTexture(canvas);
            const geo = new THREE.PlaneGeometry(1.8, 0.56);
            const mat = new THREE.MeshBasicMaterial({ map: tex });
            return new THREE.Mesh(geo, mat);
        }

        function handleVRControllerTrigger(controller) {
            if (!renderer || !renderer.xr || !renderer.xr.isPresenting) return;
            soundFX.init();

            // Verifica clique via raycast no botão 3D caso visível
            if (vrStartButton3D && vrStartButton3D.visible && controller) {
                vrTempMatrix.identity().extractRotation(controller.matrixWorld);
                vrRaycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
                vrRaycaster.ray.direction.set(0, 0, -1).applyMatrix4(vrTempMatrix);
                const hits = vrRaycaster.intersectObject(vrStartButton3D);
                if (hits.length > 0) {
                    startGame();
                }
            }
        }
